
[functions.webhook-receiver]
enabled = true
verify_jwt = false
entrypoint = "./functions/webhook-receiver/index.ts"

[functions.event-processor]
enabled = true
verify_jwt = false
import_map = "./functions/event-processor/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/event-processor/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/event-processor/*.html" ]
